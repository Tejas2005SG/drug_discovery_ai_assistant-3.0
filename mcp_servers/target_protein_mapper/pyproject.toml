[project]
name = "target-protein-mapper"
version = "0.1.0"
description = "MCP server to map symptoms to target proteins"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=0.1.0",
    "httpx>=0.27.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
target-protein-mapper = "target_protein_mapper.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
